# yaml-language-server: $schema=https://raw.githubusercontent.com/open-component-model/open-component-model/main/bindings/go/constructor/spec/v1/resources/schema-2020-12.json
components:
  - name: opendefense.cloud/krop-controller
    version: ${OCM_VERSION}
    provider:
      name: opendefense.cloud
    labels:
      - name: app.kubernetes.io/name
        value: krop-controller
      - name: app.kubernetes.io/component
        value: resource-orchestration
      - name: app.kubernetes.io/part-of
        value: krop-controller
    resources:
      # Helm Chart
      - name: krop-controller-chart
        type: helmChart
        version: "0.1.5"
        relation: external
        access:
          type: OCIImage/v1
          imageReference: ghcr.io/opendefensecloud/charts/krop-controller:0.1.5@sha256:f27c8cc5539a544746de0f43d2f6616b0e85748656a1e13e23402751052f580f
      # Values template, rendered by ocm-kit: the label links it to the chart,
      # and the image reference it emits is the localized one after transfer.
      - name: krop-controller-chart-values-template
        type: yaml
        labels:
          - name: opendefense.cloud/helm/values-for
            value: krop-controller-chart
        relation: local
        input:
          type: File/v1
          path: values.yaml.tpl
      # Controller Image. 
      - name: krop-controller-image
        type: ociImage
        version: "0.1.5"
        relation: external
        access:
          type: OCIImage/v1
          imageReference: ghcr.io/opendefensecloud/krop-controller:0.1.5@sha256:cb78ee74cbe89c89091d4c228644a7119a7438c3fdf00b127d99615d367fcebf
      # SBOMs: CycloneDX per image and platform, published by the upstream
      # release. The label links each to its image and is covered by the
      # signature, and it takes precedence over the BuildKit attestation in the
      # image index. The URL follows ${OCM_VERSION}, so a Renovate bump moves the
      # SBOMs along — and a release without them fails `make validate`.
      - name: krop-controller-image-sbom
        type: sbom
        version: ${OCM_VERSION}
        extraIdentity:
          architecture: amd64
        labels:
          - name: ocm.software/artifact-references
            signing: true
            value:
              - identity:
                  name: krop-controller-image
        relation: external
        access:
          type: Wget/v1
          url: https://github.com/opendefensecloud/krop-controller/releases/download/v${OCM_VERSION}/krop-controller-linux-amd64.cyclonedx.json
          mediaType: application/vnd.cyclonedx+json
      - name: krop-controller-image-sbom
        type: sbom
        version: ${OCM_VERSION}
        extraIdentity:
          architecture: arm64
        labels:
          - name: ocm.software/artifact-references
            signing: true
            value:
              - identity:
                  name: krop-controller-image
        relation: external
        access:
          type: Wget/v1
          url: https://github.com/opendefensecloud/krop-controller/releases/download/v${OCM_VERSION}/krop-controller-linux-arm64.cyclonedx.json
          mediaType: application/vnd.cyclonedx+json
      # Minimal Configuration (single instance, development/testing)
      - name: krop-controller-minimal-config
        type: yaml
        relation: local
        input:
          type: File/v1
          path: minimal-values.yaml
      # Production Configuration (HA with leader election, anti-affinity)
      - name: krop-controller-production-config
        type: yaml
        relation: local
        input:
          type: File/v1
          path: production-values.yaml
