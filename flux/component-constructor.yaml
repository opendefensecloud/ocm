# yaml-language-server: $schema=https://raw.githubusercontent.com/open-component-model/open-component-model/main/bindings/go/constructor/spec/v1/resources/schema-2020-12.json
components:
  - name: opendefense.cloud/flux
    # v2 has no --version flag; the value comes from the environment. An unset
    # variable expands to "" silently, so the Makefile guards it.
    version: ${OCM_VERSION}
    provider:
      name: opendefense.cloud
    labels:
      - name: app.kubernetes.io/name
        value: flux
      - name: app.kubernetes.io/component
        value: flux
      - name: app.kubernetes.io/part-of
        value: flux
    resources:
      # install via helm install
      - name: flux-chart
        type: helmChart
        version: "2.18.3"
        relation: external
        access:
          type: OCIImage/v1
          imageReference: ghcr.io/fluxcd-community/charts/flux2:2.18.3

      - name: flux-chart-values-template
        type: yaml
        version: "2.18.3"
        labels:
          - name: opendefense.cloud/helm/values-for
            value: flux-chart
        relation: local
        input:
          type: File/v1
          path: values.yaml.tpl
          mediaType: application/yaml

      # images
      - name: helm-controller-image
        type: ociImage
        version: v1.5.5
        relation: external
        access:
          type: OCIImage/v1
          imageReference: ghcr.io/fluxcd/helm-controller:v1.5.5

      - name: cli-image
        type: ociImage
        version: v2.8.8
        relation: external
        access:
          type: OCIImage/v1
          imageReference: ghcr.io/fluxcd/flux-cli:v2.8.8

      - name: image-automation-controller-image
        type: ociImage
        version: v1.1.4
        relation: external
        access:
          type: OCIImage/v1
          imageReference: ghcr.io/fluxcd/image-automation-controller:v1.1.4

      - name: image-reflector-controller-image
        type: ociImage
        version: v1.1.2
        relation: external
        access:
          type: OCIImage/v1
          imageReference: ghcr.io/fluxcd/image-reflector-controller:v1.1.2

      - name: kustomize-controller-image
        type: ociImage
        version: v1.8.5
        relation: external
        access:
          type: OCIImage/v1
          imageReference: ghcr.io/fluxcd/kustomize-controller:v1.8.5

      - name: notification-controller-image
        type: ociImage
        version: v1.8.3
        relation: external
        access:
          type: OCIImage/v1
          imageReference: ghcr.io/fluxcd/notification-controller:v1.8.3

      - name: source-controller-image
        type: ociImage
        version: v1.8.2
        relation: external
        access:
          type: OCIImage/v1
          imageReference: ghcr.io/fluxcd/source-controller:v1.8.2

      - name: source-watcher-image
        type: ociImage
        version: v2.1.1
        relation: external
        access:
          type: OCIImage/v1
          imageReference: ghcr.io/fluxcd/source-watcher:v2.1.1
