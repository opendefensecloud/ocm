name: Zizmor

# Static analysis of the workflows: unpinned actions, template injection,
# over-broad permissions. The pipeline is part of the attack surface here.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: zizmor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: Analyse workflows
    runs-on: ubuntu-24.04
    permissions:
      contents: read          # check out the workflows being analysed
      security-events: write  # upload the SARIF result to code scanning
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@70fb788f84895a7701f5643d103d587e460b5c99 # v0.6.3
