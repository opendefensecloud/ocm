# yaml-language-server: $schema=https://raw.githubusercontent.com/open-component-model/open-component-model/main/bindings/go/constructor/spec/v1/resources/schema-2020-12.json
components:
  - name: opendefense.cloud/argo-workflows
    # v2 has no --version flag; the value comes from the environment. An unset
    # variable expands to "" silently, so the Makefile guards it.
    version: ${OCM_VERSION}
    provider:
      name: argoproj.io
    labels:
      - name: app.kubernetes.io/name
        value: argo-workflows
      - name: app.kubernetes.io/component
        value: workflow-engine
      - name: app.kubernetes.io/part-of
        value: argo-workflows
    resources:
      # Argo Workflows Helm Chart (official argoproj)
      - name: argo-workflows-chart
        type: helmChart
        version: 2.0.18
        relation: external
        access:
          type: OCIImage/v1
          imageReference: ghcr.io/argoproj/argo-helm/argo-workflows:2.0.18

      - name: argo-workflows-chart-values-template
        type: yaml
        version: "1.0.14"
        labels:
          - name: opendefense.cloud/helm/values-for
            value: argo-workflows-chart
        relation: local
        input:
          type: File/v1
          path: values.yaml.tpl
          mediaType: application/yaml

      # Workflow Controller Container Image
      - name: argo-workflows-controller-image
        type: ociImage
        version: v4.0.5
        relation: external
        access:
          type: OCIImage/v1
          imageReference: quay.io/argoproj/workflow-controller:v4.0.5

      # Argo Server (CLI/UI) Container Image
      - name: argo-workflows-server-image
        type: ociImage
        version: v4.0.5
        relation: external
        access:
          type: OCIImage/v1
          imageReference: quay.io/argoproj/argocli:v4.0.5

      # Workflow Executor (argoexec) Container Image
      - name: argo-workflows-executor-image
        type: ociImage
        version: v4.0.5
        relation: external
        access:
          type: OCIImage/v1
          imageReference: quay.io/argoproj/argoexec:v4.0.5

      # Minimal Configuration (single replica, no auth, dev/test)
      - name: argo-workflows-minimal-config
        type: yaml
        relation: local
        input:
          type: File/v1
          path: minimal-values.yaml
          mediaType: application/yaml

      # Production Configuration (HA, client auth, monitoring)
      - name: argo-workflows-production-config
        type: yaml
        relation: local
        input:
          type: File/v1
          path: production-values.yaml
          mediaType: application/yaml
