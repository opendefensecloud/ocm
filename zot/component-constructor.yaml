# yaml-language-server: $schema=https://raw.githubusercontent.com/open-component-model/open-component-model/main/bindings/go/constructor/spec/v1/resources/schema-2020-12.json
components:
  - name: opendefense.cloud/zot
    # v2 has no --version flag; the value comes from the environment. An unset
    # variable expands to "" silently, so the Makefile guards it.
    version: ${OCM_VERSION}
    provider:
      name: opendefense.cloud
    labels:
      - name: app.kubernetes.io/name
        value: zot
      - name: app.kubernetes.io/component
        value: zot
      - name: app.kubernetes.io/part-of
        value: zot
    resources:
      - name: zot-chart
        type: helmChart
        version: "0.1.134"
        relation: external
        access:
          type: OCIImage/v1
          imageReference: ghcr.io/project-zot/helm-charts/zot:0.1.134

      - name: zot-chart-values-template
        type: yaml
        version: "0.1.116"
        labels:
          - name: opendefense.cloud/helm/values-for
            value: zot-chart
        relation: local
        input:
          type: File/v1
          path: values.yaml.tpl
          mediaType: application/yaml

      - name: zot-image
        type: ociImage
        version: v2.1.23
        relation: external
        access:
          type: OCIImage/v1
          imageReference: ghcr.io/project-zot/zot:v2.1.23

      - name: alpine-image
        type: ociImage
        version: "3.24"
        relation: external
        access:
          type: OCIImage/v1
          imageReference: docker.io/library/alpine:3.24
