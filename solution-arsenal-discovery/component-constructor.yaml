# yaml-language-server: $schema=https://raw.githubusercontent.com/open-component-model/open-component-model/main/bindings/go/constructor/spec/v1/resources/schema-2020-12.json
components:
  - name: opendefense.cloud/solution-arsenal-discovery
    # v2 has no --version flag; the value comes from the environment. An unset
    # variable expands to "" silently, so the Makefile guards it.
    version: ${OCM_VERSION}
    provider:
      name: opendefense.cloud
    labels:
      - name: app.kubernetes.io/name
        value: solution-arsenal-discovery
      - name: app.kubernetes.io/component
        value: registry-scanner
      - name: app.kubernetes.io/part-of
        value: solution-arsenal
    resources:
      # SolutionArsenal Discovery Helm Chart
      - name: solution-arsenal-discovery-chart
        type: helmChart
        version: 0.4.0
        relation: external
        access:
          type: OCIImage/v1
          imageReference: ghcr.io/opendefensecloud/charts/solar-discovery:0.4.0

      # Helm Values Template for SolutionArsenal Discovery Helm Chart
      - name: helm-values-template
        type: yaml
        labels:
          - name: opendefense.cloud/helm/values-for
            value: solution-arsenal-discovery-chart
        relation: local
        input:
          type: File/v1
          path: values.yaml.tpl
          mediaType: application/yaml

      # Solar Discovery Container Image
      - name: solution-arsenal-discovery-image
        type: ociImage
        version: 0.4.0
        relation: external
        access:
          type: OCIImage/v1
          imageReference: ghcr.io/opendefensecloud/solar-discovery:0.4.0

      # Minimal Configuration (single instance, scan-only mode)
      - name: solution-arsenal-discovery-minimal-config
        type: yaml
        relation: local
        input:
          type: File/v1
          path: minimal-values.yaml
          mediaType: application/yaml

      # Production Configuration (2 replicas, webhook enabled, anti-affinity)
      - name: solution-arsenal-discovery-production-config
        type: yaml
        relation: local
        input:
          type: File/v1
          path: production-values.yaml
          mediaType: application/yaml
